dependencies {
    api project(':api')
    api libs.lettuce
    implementation libs.discord.json.api
    implementation libs.jackson.datatype.jdk8
    implementation libs.jackson.datatype.jsr310
    annotationProcessor libs.servicer

    testImplementation project(':tck')
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter.engine
    testImplementation libs.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.assertj
    testRuntimeOnly libs.junit.platform.launcher
}

javadoc {
    dependsOn project(':api').javadoc

    options.linksOffline rootProject.buildDocsUrl('stores-api'), project(':api').javadoc.destinationDir.toURI() as String
}

jar {
    manifest {
        attributes 'Implementation-Title': base.archivesName.get(),
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'discord4j.store.redis'
    }
}
